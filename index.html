<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>PvP 大師戰績本</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PvP大師">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: one-handed logbook. Teams on top, the win/loss buttons and tabs stay under the thumb. */
:root {
  --bg: #eef1f7; --surface: #ffffff; --surface2: #e2e7f1; --fg: #151b2b; --muted: #5d6679; --line: #d2d8e5;
  --win: #15803d; --loss: #c62e3a; --draw: #5d6679; --on-solid: #ffffff;
  --accent: #7436c9; --gutter-l: max(16px, env(safe-area-inset-left, 0px)); --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101626; --surface: #1a2235; --surface2: #262f46; --fg: #eef1f8; --muted: #9aa4ba; --line: #2f3952;
    --win: #1f9d51; --loss: #d9414e; --draw: #66708a; --accent: #b794ff; color-scheme: dark;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--font); font-variant-numeric: tabular-nums; overscroll-behavior-y: none; }
button, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
[hidden] { display: none !important; }

#app { height: 100%; display: flex; flex-direction: column; }
main { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px); padding-bottom: 0; padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  display: flex; flex-direction: column; gap: 14px; }
.wrap-narrow { padding-bottom: 8px; width: 100%; max-width: 640px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs button { padding: 13px 0; font-size: 14px; color: var(--muted); font-weight: 500; }
.tabs button[aria-current="page"] { color: var(--accent); font-weight: 700; box-shadow: inset 0 2px 0 var(--accent); }

.topline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.topline h1 { font-size: 20px; font-weight: 800; letter-spacing: .01em; }
.top-right { display: flex; align-items: center; gap: 10px; }
.backup-btn { padding: 6px 12px; font-size: 13px; color: var(--accent); }
.tally { font-size: 14px; color: var(--muted); }
.tally b { font-weight: 800; }
.tally .w { color: var(--win); } .tally .l { color: var(--loss); }

.seg { display: flex; background: var(--surface2); border-radius: 11px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 8px 4px; border-radius: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--accent); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / .14); }

.team { display: flex; flex-direction: column; gap: 7px; }
.team h2 { font-size: 13px; font-weight: 700; color: var(--muted); }
.slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.slot { background: var(--surface); border-radius: 13px; display: flex; flex-direction: column; border: 1px solid transparent; min-width: 0; overflow: hidden; }
.slot.empty { background: transparent; border: 1.5px dashed var(--line); color: var(--muted); font-size: 14px; min-height: 112px; align-items: center; justify-content: center; }
.slot-mon { flex: 1; padding: 9px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; min-width: 0; }
.slot-moves { background: var(--surface2); padding: 5px 4px 6px; display: flex; flex-direction: column; gap: 1px; text-align: center; font-size: 11.5px; line-height: 1.3; overflow-wrap: anywhere; }
.slot-moves .f { font-weight: 700; }
.team h2 small { font-weight: 500; font-size: 12px; margin-left: 4px; }
.mv-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 7px; }
.mv { display: flex; align-items: center; gap: 7px; padding: 10px; border-radius: 11px; background: var(--surface); border: 2px solid transparent; text-align: left; font-size: 14px; font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.mv[aria-pressed="true"] { border-color: var(--accent); }
.mv .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.mv .tag { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted); white-space: nowrap; }
.mv-line { font-size: 13px; color: var(--muted); }
.sheet-row { display: flex; gap: 8px; }
.sheet-row .btn { flex: 1; }
.nm { font-size: 13.5px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.fm { font-size: 11px; color: var(--muted); line-height: 1.2; overflow-wrap: anywhere; }

.mon { position: relative; width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--surface2); }
.mon.sm { width: 32px; height: 32px; }
.mon .fb { font-size: 18px; font-weight: 700; color: var(--muted); }
.mon.sm .fb { font-size: 13px; }
.mon img { position: absolute; inset: -6%; width: 112%; height: 112%; max-width: none; object-fit: contain; image-rendering: auto; }
.mon.shadow::after { content: "暗"; position: absolute; right: -3px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: #6b2fb3; color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center; }
.mon.sm.shadow::after { width: 13px; height: 13px; font-size: 8px; right: -3px; bottom: -3px; }

.actions { display: grid; grid-template-columns: 1fr 64px 1fr; gap: 8px; margin-top: auto; padding-block: 8px; position: sticky; bottom: 0; background: var(--bg); z-index: 2; }
.next-bar { margin-top: auto; padding-block: 8px; position: sticky; bottom: 0; background: var(--bg); z-index: 2; display: flex; }
.next-bar .btn { flex: 1; padding: 15px; font-size: 16px; border-radius: 14px; }
.actions button { height: 76px; border-radius: 16px; color: var(--on-solid); font-size: 26px; font-weight: 800; }
.actions button:active { transform: scale(.97); }
.actions .w { background: var(--win); } .actions .l { background: var(--loss); }
.actions .d { background: var(--surface2); color: var(--fg); font-size: 15px; font-weight: 600; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 62px); z-index: 40; width: min(92vw, 420px);
  background: #151b2b; color: #fff; border-radius: 12px; padding: 11px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; font-size: 14px; box-shadow: 0 6px 20px rgb(0 0 0 / .3); }
.toast button { color: #ffd166; font-weight: 700; white-space: nowrap; padding: 2px 4px; }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(6 10 20 / .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 94%; height: 94%; border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  padding-top: 14px; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: var(--gutter-l); padding-right: var(--gutter-r); gap: 10px; }
.sheet.auto { height: auto; overflow-y: auto; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); gap: 14px; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-head h2 { font-size: 17px; font-weight: 800; }
.btn { padding: 9px 16px; border-radius: 10px; background: var(--surface2); font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn.primary { background: var(--accent); color: var(--on-solid); font-weight: 700; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #101626; } }
.btn.danger { color: var(--loss); }
.btn.danger.armed { background: var(--loss); color: #fff; }
.search { width: 100%; padding: 11px 13px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.picked { display: flex; gap: 6px; min-height: 26px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.chip { background: var(--accent); color: var(--on-solid); border-radius: 8px; padding: 3px 9px; font-weight: 600; font-size: 13px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip { color: #101626; } }
.pick-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; }
.pick-body h3 { font-size: 13px; color: var(--muted); font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 7px; }
.tile { position: relative; background: var(--surface); border-radius: 13px; padding: 12px 3px 8px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-align: center; border: 2px solid transparent; min-width: 0; }
.tile[aria-pressed="true"] { border-color: var(--accent); }
.tile .rk { position: absolute; left: 7px; top: 4px; font-size: 11px; font-weight: 600; color: var(--muted); }
.tile .ord { position: absolute; right: 5px; top: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: var(--on-solid); font-size: 12px; font-weight: 800; display: grid; place-items: center; z-index: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tile .ord { color: #101626; } }

/* Stats */
.hero { background: var(--surface); border-radius: 16px; padding: 16px; display: flex; align-items: center; gap: 18px; }
.hero .pct { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -.01em; }
.hero .pct small { font-size: 20px; font-weight: 700; }
.hero .cap { font-size: 12px; color: var(--muted); margin-top: 4px; }
.hero .wld { margin-left: auto; display: grid; grid-template-columns: auto auto; gap: 2px 8px; font-size: 14px; text-align: right; }
.hero .wld span { color: var(--muted); }
.hero .wld b { font-weight: 800; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.section-head h2 { font-size: 15px; font-weight: 800; }
.seg.mini { min-width: 180px; } .seg.mini button { padding: 5px 10px; font-size: 13px; }
.rows { background: var(--surface); border-radius: 14px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 52px; align-items: center; gap: 10px; padding: 9px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.row:first-child { border-top: 0; }
.who { display: flex; align-items: center; gap: 9px; min-width: 0; }
.who .txt { min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.who .txt .fm { display: block; font-weight: 400; }
.trio { display: flex; flex: none; }
.trio .mon { margin-left: -7px; box-shadow: 0 0 0 2px var(--surface); } .trio .mon:first-child { margin-left: 0; }
.rec { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.rate { font-weight: 800; text-align: right; font-size: 15px; }
.rate.lo { color: var(--loss); } .rate.hi { color: var(--win); }
.note { font-size: 12.5px; color: var(--muted); }
.empty-state { background: var(--surface); border-radius: 14px; padding: 26px 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }

.last-head { display: flex; align-items: center; gap: 8px; }
.last-head .pill { width: 28px; height: 28px; font-size: 14px; }
.last-head h2 { font-size: 15px; font-weight: 800; color: var(--fg); }
.br-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.br-toggle { padding: 6px 14px; font-size: 13px; flex: none; color: var(--accent); }
.br.br-matrix td { width: 23%; font-size: 14px; padding: 8px 4px; }
.band { display: block; padding: 8px 2px; border-radius: 9px; font-weight: 800; white-space: nowrap; }
.band.big-win { background: var(--win); color: #fff; }
.band.win { background: color-mix(in srgb, var(--win) 22%, var(--surface)); color: color-mix(in srgb, var(--win) 60%, var(--fg)); }
.band.even { background: var(--surface2); color: var(--fg); }
.band.loss { background: color-mix(in srgb, var(--loss) 20%, var(--surface)); color: color-mix(in srgb, var(--loss) 60%, var(--fg)); }
.band.big-loss { background: var(--loss); color: #fff; }
.br.br-matrix td.br-wait { font-size: 15px; }
.mx-head { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--fg); font-size: 11.5px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere; }
.br-shields { display: flex; gap: 10px; flex-wrap: wrap; }
.br-shield { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); flex: 1; min-width: 150px; }
.br-shield .seg.mini { min-width: 0; flex: 1; }
.br-wrap { background: var(--surface); border-radius: 14px; overflow-x: auto; }
.br { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.br th, .br td { padding: 7px 3px; border-top: 1px solid var(--line); font-weight: 400; }
.br thead th { border-top: 0; font-size: 10.5px; line-height: 1.15; color: var(--muted); text-align: center; vertical-align: bottom; font-weight: 600; }
.br thead th:first-child { text-align: left; padding-left: 10px; }
.br tbody th { text-align: left; padding-left: 10px; }
.br td { text-align: center; width: 13%; font-weight: 600; }
.br .who { gap: 6px; }
.br .who .txt { font-size: 12.5px; }
.br-group th { background: var(--surface2); padding-block: 5px; }
.br-group .who .txt { font-size: 13px; font-weight: 700; }
.br-main { font-size: 15px; font-weight: 800; }
.br-w { color: var(--win); } .br-l { color: var(--loss); }
.br-none { color: var(--muted); }
.br-wait { color: var(--muted); font-size: 12.5px; font-weight: 400; }

/* History */
.day { font-size: 13px; font-weight: 700; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.battle { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); width: 100%; text-align: left; }
.battle:first-child { border-top: 0; }
.pill { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px; }
.pill.w { background: var(--win); } .pill.l { background: var(--loss); } .pill.d { background: var(--draw); }
.vs { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; font-size: 12px; color: var(--muted); }
.time { font-size: 12px; color: var(--muted); text-align: right; line-height: 1.3; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row .sub { font-size: 12.5px; color: var(--muted); }
.result-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.result-pick button { padding: 12px 0; border-radius: 11px; background: var(--surface2); font-weight: 700; }
.result-pick button[aria-pressed="true"].w { background: var(--win); color: #fff; }
.result-pick button[aria-pressed="true"].l { background: var(--loss); color: #fff; }
.result-pick button[aria-pressed="true"].d { background: var(--draw); color: #fff; }
@media (prefers-reduced-motion: no-preference) { .scrim .sheet { animation: rise .16s ease-out; } @keyframes rise { from { transform: translateY(24px); } } }
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav class="tabs" id="tabs" aria-label="主選單"></nav>
</div>
<div id="overlay"></div>
<div id="toast"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
